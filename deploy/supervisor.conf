; Supervisor — App Magasin Lycée
; Copier dans /etc/supervisor/conf.d/app-magasin.conf
; puis : sudo supervisorctl reread && sudo supervisorctl update

; ─── Queue worker (notifications email / database) ──────────────────────────
[program:app-magasin-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/app-magasin/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --queue=default
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/app-magasin/storage/logs/worker.log
stopwaitsecs=3600

; ─── Scheduler (vérification stock bas à 08h00) ─────────────────────────────
; Le scheduler Laravel utilise une cron — voir deploy/cron.conf
; Ce bloc optionnel lance le scheduler en continu (alternative à cron)
[program:app-magasin-scheduler]
process_name=%(program_name)s
command=php /var/www/app-magasin/artisan schedule:work
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/app-magasin/storage/logs/scheduler.log
