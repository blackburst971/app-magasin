server {
    listen 80;
    listen [::]:80;
    server_name 192.168.1.14;

    root /var/www/app-magasin/public;
    index index.php;
    charset utf-8;

    # Sécurité : headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Taille max upload (documents PDF, images)
    client_max_body_size 32M;

    # Laravel — toutes les requêtes vers index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Assets Vite (cache long terme)
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Service Worker PWA — doit pouvoir contrôler toute l'app (scope /)
    location = /build/sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        access_log off;
    }

    # Manifest PWA
    location = /build/manifest.webmanifest {
        expires off;
        add_header Cache-Control "no-cache";
        add_header Content-Type "application/manifest+json";
        access_log off;
    }

    # Storage public (images, QR codes, documents)
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Interdire l'accès aux fichiers cachés (.env, .git…)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Logs
    access_log /var/log/nginx/app-magasin-access.log;
    error_log  /var/log/nginx/app-magasin-error.log;
}
